<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VOB Estimate Chat</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1c2230;--mute:#6b7385;--acc:#2358d6;--line:#e3e6ec}
@media (prefers-color-scheme:dark){:root{--bg:#12151c;--card:#1b2030;--ink:#e8ebf2;--mute:#8d96ab;--acc:#6c93ff;--line:#2a3045}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,sans-serif}
#app{max-width:640px;margin:0 auto;height:100dvh;display:flex;flex-direction:column}
#log{flex:1;overflow:auto;padding:16px}
.m{max-width:85%;padding:10px 13px;border-radius:14px;margin:6px 0;white-space:pre-wrap}
.bot{background:var(--card);border:1px solid var(--line)}.me{background:var(--acc);color:#fff;margin-left:auto}
.opts{display:flex;flex-direction:column;gap:8px;margin:8px 0}
.opts button{text-align:left;padding:10px 13px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.opts button:hover{border-color:var(--acc)}
form{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line);background:var(--card)}
input{flex:1;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
input:disabled{opacity:.5}form button{padding:0 18px;border:0;border-radius:10px;background:var(--acc);color:#fff;font:inherit;cursor:pointer}
form button:disabled{opacity:.5}#att{background:var(--bg);color:var(--ink);border:1px solid var(--line);font-size:13px;padding:0 12px}
.est{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:8px 0}
.est h3{margin:0 0 8px;font-size:15px}.row{display:flex;justify-content:space-between;gap:12px;padding:4px 0;border-bottom:1px dashed var(--line)}
.row span:last-child{white-space:nowrap}.tot{font-weight:700;border:0;padding-top:8px}.sub{color:var(--mute);font-size:13px}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:5px 6px;border-bottom:1px dashed var(--line);text-align:right}th:first-child,td:first-child{text-align:left}.tt td{border:0;padding-top:8px}.win{margin-top:8px;font-weight:600;color:var(--acc)}
</style></head><body><div id="app"><div id="log"></div>
<form id="f"><button type="button" id="att" title="Attach a photo or PDF of your insurance card" aria-label="Attach insurance card photo or PDF">Card photo</button><input id="photo" type="file" accept="image/*,application/pdf,.pdf,.heic,.heif" hidden><input id="t" placeholder="Type your message" autocomplete="off"><button id="b">Send</button></form></div>
<script>
const log=document.getElementById('log'),t=document.getElementById('t'),b=document.getElementById('b');
let sid=null;
const $=(h,c)=>{const d=document.createElement('div');d.className=c||'';d.innerHTML=h;log.appendChild(d);log.scrollTop=1e9;return d};
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const bot=x=>{const d=$('', 'm bot');d.textContent=x;log.scrollTop=1e9};
const me=x=>{const d=$('', 'm me');d.textContent=x};
const att=document.getElementById('att'),photo=document.getElementById('photo');
const lock=(l,ph)=>{t.disabled=b.disabled=att.disabled=l;t.placeholder=ph||(l?'Choose an option above':'Type your message');if(!l)t.focus()};
const money=n=>n==null?'—':'$'+n.toFixed(2);
const api=(p,body)=>fetch(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{})}).then(async r=>{if(!r.ok)throw new Error((await r.json()).detail||r.status);return r.json()});
function buttons(items,fn){const d=$('','opts');items.forEach(i=>{const e=document.createElement('button');e.textContent=i.label;e.onclick=()=>{d.remove();fn(i)};d.appendChild(e)})}
function card(est){est.clinics.forEach(c=>{
 const rows=c.lines.map(l=>`<div class="row"><span>${esc(l.name)} <span class="sub">${l.estimable?'('+esc(l.cost_type)+')':esc(l.note)}</span></span><span>${l.estimable?(l.low===l.high?money(l.low):money(l.low)+'–'+money(l.high)):'n/a'}</span></div>`).join('');
 $(`<h3>${esc(c.clinic)}</h3>${rows}<div class="row tot"><span>Estimated total</span><span>${money(c.total_low)}–${money(c.total_high)}</span></div>
 <div class="sub">Deductible remaining now: ${money(c.deductible_remaining_before)}${c.complete?'':' · some items could not be priced'}</div>`,'est')});
 const k=est.comparison;if(k){
  const rng=x=>x?(x.low===x.high?money(x.low):money(x.low)+'–'+money(x.high)):'n/a';
  const head=k.clinics.map(n=>`<th>${esc(n)}</th>`).join('');
  const body=k.rows.map(r=>`<tr><td>${esc(r.name)}</td>${r.cells.map(x=>`<td>${rng(x)}</td>`).join('')}</tr>`).join('');
  const tot=k.totals.map(x=>`<td><b>${rng(x)}</b>${x.complete?'':'*'}</td>`).join('');
  const win=k.cheapest?`<div class="win">${esc(k.cheapest)} looks cheaper: you could save about ${money(k.savings.amount)} vs ${esc(k.savings.vs)}.</div>`:'<div class="sub">Not every item could be priced at both clinics, so no clear winner.</div>';
  $(`<h3>Compare clinics</h3><div class="scroll"><table><tr><th></th>${head}</tr>${body}<tr class="tt"><td>Total</td>${tot}</tr></table></div>${win}`,'est')}
 $(`<div class="sub">${esc(est.disclaimer)}</div>`)}
async function pick(o,ans){lock(true,'Checking your benefits…');
 try{const r=await api(`/sessions/${sid}/select`,{option_id:o.option_id,followup_answer:ans});
 bot(r.message);
 if(r.quick_replies){buttons(r.quick_replies.map(q=>({label:q.label,value:q.value})),q=>{me(q.label);pick(o,q.value)});return}
 if(r.estimate&&r.estimate.status==='ok')card(r.estimate);
 lock(false)}catch(e){bot('Error: '+e.message);lock(false)}}
function shrink(file){return new Promise((ok,no)=>{const img=new Image(),u=URL.createObjectURL(file);img.onload=()=>{const k=Math.min(1,1600/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',0.85).split(',')[1])};img.onerror=()=>no(new Error('Could not read that image'));img.src=u})}
att.onclick=()=>photo.click();
const rawB64=f=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]);r.onerror=()=>no(new Error('Could not read that file'));r.readAsDataURL(f)});
const noResize=f=>f.type==='application/pdf'||/heic|heif/i.test(f.type)||/\.(pdf|heic|heif)$/i.test(f.name);
photo.onchange=async()=>{const f=photo.files[0];photo.value='';if(!f)return;
 try{let data,mt='image/jpeg';
  if(noResize(f)){if(f.size>4.5e6)throw new Error('That file is over 4.5 MB. Try a smaller photo or a screenshot of the card.');data=await rawB64(f);mt=f.type||'application/octet-stream'}
  else data=await shrink(f);
  send('',[{media_type:mt,data}],'Card photo sent')}catch(err){bot('Error: '+err.message)}};
document.getElementById('f').onsubmit=e=>{e.preventDefault();const x=t.value.trim();if(!x)return;t.value='';send(x)};
async function send(x,images,shown){me(shown||x);lock(true,'Thinking…');
 try{const r=await api(`/sessions/${sid}/messages`,{text:x,images:images||[]});bot(r.message);if(r.estimate&&r.estimate.status==='ok')card(r.estimate);
  if(r.menu){bot(r.menu.message);buttons(r.menu.options,o=>{me(o.label);pick(o)});lock(true);return}}
 catch(err){bot('Error: '+err.message)}lock(false)}
(async()=>{try{const s=await api('/sessions');sid=s.session_id;bot(s.message);lock(false)}catch(e){bot('Could not start: '+e.message)}})();
</script></body></html>
